plugins {
    id 'com.android.application' version '9.2.1'
}
android {
    namespace 'dev.nowlyrics'
    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'dev.nowlyrics'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '2.0.2'
    }
}

dependencies { compileOnly 'io.github.libxposed:api:101.0.0' }
